<mat-sidenav-container class="sidenav-container">
  
  <mat-sidenav #drawer mode="side" opened class="sidenav" fixedInViewport>
    <div class="logo-container">
      <mat-icon>admin_panel_settings</mat-icon>
      <span>Admin Panel</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/admin/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      
      <a mat-list-item routerLink="/admin/users" routerLinkActive="active-link">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Users</span>
      </a>

      <a mat-list-item routerLink="/admin/settings" routerLinkActive="active-link">
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Settings</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    
    <mat-toolbar color="primary" class="header-toolbar">
      <button mat-icon-button class="menu-toggle" (click)="toggleSidenav()">
        <mat-icon>menu</mat-icon>
      </button>
      
      <span>Welcome, Administrator</span>
      
      <span class="spacer"></span>
      
      <button mat-icon-button>
        <mat-icon>notifications</mat-icon>
      </button>
      <button mat-button color="warn">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </mat-toolbar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>
</mat-sidenav-container>
