<div class="login-container">
  <div class="login-card">
    <h2 class="login-title">Login to Your Account</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="username">Email</label>
        <input
          id="email"
          type="text"
          formControlName="email"
          placeholder="Enter your email"
          [class.is-invalid]="email?.invalid && email?.touched"
        />
        <div class="error-text" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">Username is required.</span>
          <span *ngIf="email?.errors?.['minlength']">Must be at least 3 characters.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            [class.is-invalid]="password?.invalid && password?.touched"
          />
          <button type="button" class="toggle-btn" (click)="togglePasswordVisibility()">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <div class="error-text" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Password is required.</span>
          <span *ngIf="password?.errors?.['minlength']">Must be at least 6 characters.</span>
        </div>
      </div>

      <div class="alert-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
      <app-captcha (captchaChange)="onCaptchaChange($event)"></app-captcha>
      <button type="submit" class="submit-btn" [disabled]="isLoading">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>

    </form>
    <a routerLink="/register">
  DEBUG: {{ isLoading }}
    </a>
  </div>
</div>
